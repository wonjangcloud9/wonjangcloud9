name: 실험실 현황판 갱신

on:
  schedule:
    - cron: "30 18 * * *" # 매일 03:30 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/dashboard.mjs
      - .github/workflows/dashboard.yml

jobs:
  dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # LAB_TOKEN: read:user 스코프가 있는 PAT.
      # 없으면 비공개 커밋(대부분)이 0으로 잡히므로 스크립트가 스스로 중단하고
      # 이미 커밋된 SVG를 그대로 둔다.
      - name: 현황판 그리기
        env:
          GITHUB_TOKEN: ${{ secrets.LAB_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/dashboard.mjs

      - name: 바뀐 게 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain assets)" ]]; then
            git add assets
            git commit -m "chore: 실험실 현황판 갱신 ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "바뀐 게 없다"
          fi
